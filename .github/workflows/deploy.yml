name: Publish VerityStory to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Configure or enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4
